<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>Spravy 360 - Predstavovak</title>
  <style>
    :root {
      --stage-width: 1920px;
      --stage-height: 1080px;
      --safe-left: 0px;
      --safe-top: 0px;
    }

    html,
    body {
      width: var(--stage-width);
      height: var(--stage-height);
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    @font-face {
      font-family: "Bauplan";
      font-style: normal;
      font-weight: 900;
      src: local("Bauplan Heavy"), local("Bauplan-Heavy"), local("Bauplan");
    }

    @font-face {
      font-family: "Diform";
      font-style: normal;
      font-weight: 400;
      src: local("Diform Regular"), local("Diform-Regular"), local("Diform");
    }

    .stage {
      position: relative;
      width: var(--stage-width);
      height: var(--stage-height);
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .stage.is-playing {
      animation: lower-third-in 420ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .stage.is-stopping {
      animation: lower-third-out 280ms cubic-bezier(.7, 0, .84, 0) both;
    }

    .panel {
      position: absolute;
      left: 46px;
      top: 847px;
      width: 1620px;
      height: 160px;
      border-radius: 20px;
      background: transparent;
      box-shadow:
        inset 0 0 0 1000px rgba(0, 0, 0, .4),
        0 4px 10px rgba(0, 0, 0, .8),
        0 0 26px rgba(0, 0, 0, .35),
        inset 0 1px 1px rgba(255, 255, 255, .5),
        inset 0 0 32px rgba(255, 255, 255, .03);
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }

    .panel-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, 0) 28%),
        rgba(0, 0, 0, .4);
    }

    .panel-fill-left {
      left: 0;
      border-radius: 20px 0 0 20px;
    }

    .panel-fill-right {
      right: 0;
      border-radius: 0 20px 20px 0;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(255, 255, 255, .12), transparent 42%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 0, 0, .34), transparent 58%);
      pointer-events: none;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: .18;
      background-image:
        radial-gradient(circle at 17% 32%, rgba(255, 255, 255, .13) 0 .8px, transparent .9px),
        radial-gradient(circle at 71% 64%, rgba(0, 0, 0, .3) 0 .9px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035), transparent 28%, rgba(0, 0, 0, .08));
      background-size: 4px 4px, 5px 5px, 100% 100%;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      left: 80px;
      top: 878px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .18), transparent 34%),
        #2c7dff;
      box-shadow: 0 0 10px rgba(44, 125, 255, .22);
      pointer-events: none;
      user-select: none;
    }

    .name,
    .title {
      position: absolute;
      color: #fff;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: normal;
      letter-spacing: 0;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .name {
      left: 140px;
      top: 872px;
      width: 1440px;
      height: 76px;
      font-family: "Bauplan", "Arial Black", Arial, Helvetica, sans-serif;
      font-size: 64px;
      font-weight: 900;
      line-height: 76px;
      font-style: normal;
      font-kerning: normal;
      font-feature-settings: "kern" 1;
    }

    .title {
      left: 80px;
      top: 930px;
      width: 1450px;
      height: 54px;
      font-family: "Diform", Arial, Helvetica, sans-serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 50px;
      font-style: normal;
      font-kerning: normal;
      font-feature-settings: "kern" 1;
    }

    @keyframes lower-third-in {
      from {
        opacity: 0;
        transform: translate3d(-36px, 18px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes lower-third-out {
      from {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
      to {
        opacity: 0;
        transform: translate3d(-36px, 18px, 0);
      }
    }
  </style>
</head>
<body>
  <main id="template" class="stage">
    <div class="panel">
      <span class="panel-fill panel-fill-left"></span>
      <span class="panel-fill panel-fill-right"></span>
    </div>
    <div class="dot"></div>
    <p id="name" class="name">Peter Pellegrini</p>
    <p id="title" class="title">Prezident Slovenskej republiky</p>
  </main>

  <script>
    (() => {
      const stageElement = document.getElementById("template");
      const fields = {
        name: document.getElementById("name"),
        title: document.getElementById("title")
      };

      function fitText(element, maxSize, minSize) {
        element.style.fontSize = maxSize + "px";
        while (element.scrollWidth > element.clientWidth && maxSize > minSize) {
          maxSize -= 1;
          element.style.fontSize = maxSize + "px";
        }
      }

      function parseTemplateData(rawData) {
        if (!rawData) return {};
        if (typeof rawData === "object") return rawData;

        const data = String(rawData).trim();
        if (!data) return {};

        try {
          return JSON.parse(data);
        } catch (error) {
          // CasparCG Client commonly sends templateData XML.
        }

        const result = {};
        try {
          const xml = new DOMParser().parseFromString(data, "text/xml");
          xml.querySelectorAll("componentData").forEach((component) => {
            const id = component.getAttribute("id");
            const valueNode = component.querySelector("data");
            if (!id || !valueNode) return;
            result[id] = valueNode.getAttribute("value") || valueNode.textContent || "";
          });
        } catch (error) {
          console.warn("Unable to parse template data", error);
        }
        return result;
      }

      function applyData(rawData) {
        const data = parseTemplateData(rawData);
        const nextName = data.name || data.Name || data.meno || data.f0;
        const nextTitle = data.title || data.Title || data.titulok || data.f1;

        if (nextName !== undefined) fields.name.textContent = nextName;
        if (nextTitle !== undefined) fields.title.textContent = nextTitle;

        fitText(fields.name, 64, 34);
        fitText(fields.title, 42, 24);
      }

      function play() {
        stageElement.classList.remove("is-stopping");
        stageElement.classList.remove("is-playing");
        void stageElement.offsetWidth;
        stageElement.classList.add("is-playing");
      }

      function stop() {
        stageElement.classList.remove("is-playing");
        stageElement.classList.add("is-stopping");
      }

      function update(rawData) {
        applyData(rawData);
      }

      window.play = play;
      window.stop = stop;
      window.update = update;
      window.applyData = applyData;

      applyData({});
    })();
  </script>
</body>
</html>
